<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#111827" />
<title>DeepFilterNet Denoiser</title>
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<main>
  <header>
    <h1>DeepFilterNet Denoiser</h1>
    <p class="sub">Clean up noisy recordings right on your machine. Audio never leaves your PC.</p>
  </header>

  <section class="card">
    <div id="drop" class="drop">
      <input id="file" type="file" accept="audio/*" hidden />
      <p><strong>Drop an audio file</strong> or <button id="browse" class="link">browse</button></p>
      <p id="filename" class="muted">No file selected</p>
    </div>
  </section>

  <section class="card">
    <label class="row">
      <span>Noise reduction strength</span>
      <output id="attenVal">100 dB</output>
    </label>
    <input id="atten" type="range" min="0" max="100" step="1" value="100" />
    <div class="ticks"><span>Off</span><span>Light</span><span>Meeting</span><span>Max</span></div>

    <label class="row check">
      <input id="pf" type="checkbox" />
      <span>Extra post-filter (over-attenuate very noisy parts)</span>
    </label>

    <button id="go" class="primary" disabled>Enhance</button>
    <p id="status" class="muted"></p>
  </section>

  <section id="result" class="card" hidden>
    <div class="ab">
      <div>
        <h3>Original</h3>
        <audio id="orig" controls></audio>
      </div>
      <div>
        <h3>Enhanced</h3>
        <audio id="enh" controls></audio>
      </div>
    </div>
    <a id="download" class="primary" download>Download enhanced WAV</a>
  </section>
</main>
<script src="/app.js"></script>
</body>
</html>
