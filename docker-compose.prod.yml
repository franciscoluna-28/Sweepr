# Self-hosted Sweepr.
#
#   cp .env.example .env
#   docker compose -f docker-compose.prod.yml up --build -d
#   docker compose -f docker-compose.prod.yml logs sweepr
#
# Set SWEEPR_TOKEN to keep the same link across restarts. Without it, a new
# token is generated and printed in the logs on every start.
#
# LAN access example:
#   SWEEPR_BIND=0.0.0.0
#   SWEEPR_TRUSTED_HOSTS=192.168.1.50:8765   # exact Host header, port included
#
# Behind a TLS proxy on 443, use the forwarded domain name:
#   SWEEPR_TRUSTED_HOSTS=sweepr.example.com
#
# The bundled engine is linux/amd64; use an x86_64 host.
services:
  sweepr:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/franciscoluna-28/sweepr:latest
    environment:
      SWEEPR_TOKEN: "${SWEEPR_TOKEN:-}"
      SWEEPR_TRUSTED_HOSTS: "${SWEEPR_TRUSTED_HOSTS:-}"
    ports:
      - "${SWEEPR_BIND:-127.0.0.1}:${SWEEPR_HOST_PORT:-8765}:8765"
    volumes:
      - sweepr-data:/data
    restart: unless-stopped

volumes:
  sweepr-data:
