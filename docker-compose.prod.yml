# Production stack: one container serving the built UI + the API.
# Build:  docker compose -f docker-compose.prod.yml up --build
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SWEEPR_PORT: "${SWEEPR_PORT:-8765}"
    ports:
      - "${SWEEPR_PORT:-8765}:${SWEEPR_PORT:-8765}"
    volumes:
      - model-cache:/root/.cache
    restart: unless-stopped

volumes:
  model-cache:
