# Production stack: one container serving the built UI + the API.
# Build:  docker compose -f docker-compose.prod.yml up --build
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      MEOWLESS_PORT: "${MEOWLESS_PORT:-8765}"
    ports:
      - "${MEOWLESS_PORT:-8765}:${MEOWLESS_PORT:-8765}"
    volumes:
      - model-cache:/root/.cache
    restart: unless-stopped

volumes:
  model-cache:
