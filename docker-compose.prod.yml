# Production stack: one container serving the built UI + the API.
# Build:  docker compose -f docker-compose.prod.yml up --build
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8765:8765"
    environment:
      # Host audio bridge — run `python audio_bridge.py` natively for record mode.
      MEOWLESS_AUDIO_BRIDGE: ${MEOWLESS_AUDIO_BRIDGE:-http://host.docker.internal:8766}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - model-cache:/root/.cache
    restart: unless-stopped

volumes:
  model-cache:
